<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dhaka Night Market</title>
    <script>
      // Single Page Application redirect for GitHub Pages & Cloudflare Pages
      (function () {
        var isGitHubPages = window.location.pathname.indexOf('/Dhaka-Night-Market/') === 0;
        var base = isGitHubPages ? '/Dhaka-Night-Market/' : '/';
        var path = window.location.pathname;
        if (isGitHubPages) {
          path = path.slice('/Dhaka-Night-Market/'.length);
        } else if (path.charAt(0) === '/') {
          path = path.slice(1);
        }
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        if (path && path !== 'index.html' && path !== '404.html') {
          window.location.replace(base + '#/' + path + search + hash);
        } else {
          window.location.replace(base + search + hash);
        }
      })();
    </script>
  </head>
  <body style="background-color: #070B19; color: #f1f5f9; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to <a href="/Dhaka-Night-Market/" style="color: #f59e0b;">Dhaka Night Market</a>...</p>
  </body>
</html>
