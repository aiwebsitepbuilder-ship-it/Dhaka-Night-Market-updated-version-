<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dhaka Night Market</title>
    <script>
      // Single Page Application redirect for GitHub Pages & custom domains
      (function () {
        var pathname = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Extract repository prefix if hosted on GitHub Pages (e.g. /<repo-name>/)
        var pathSegments = pathname.split('/').filter(Boolean);
        var base = '/';
        var pagePath = '';

        if (window.location.hostname.endsWith('github.io') && pathSegments.length > 0) {
          // First segment is repository name on GitHub Pages
          var repo = pathSegments[0];
          base = '/' + repo + '/';
          pagePath = pathSegments.slice(1).join('/');
        } else {
          pagePath = pathSegments.join('/');
        }

        if (pagePath && pagePath !== 'index.html' && pagePath !== '404.html') {
          window.location.replace(base + '#/' + pagePath + search + hash);
        } else {
          window.location.replace(base + search + hash);
        }
      })();
    </script>
  </head>
  <body style="background-color: #070B19; color: #f1f5f9; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to <a href="./" style="color: #f59e0b;">Dhaka Night Market</a>...</p>
  </body>
</html>
